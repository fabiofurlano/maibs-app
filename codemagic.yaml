workflows:
  ios-build:
    name: MAIBS Companion iOS
    environment:
      flutter: "3.41.9"
      xcode: latest
    scripts:
      - flutter pub get
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_KEY
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
